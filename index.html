<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiJourney</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@72,500&amp;display=swap">
  <link rel="stylesheet" href="css/styles.min.css">
  <script src="js/app.min.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="hero">

      <h1 class="wordmark">MiJourney</h1>
      <p class="intro">Contigo en cada paso y cada repetición.</p>
    </header>

    <div class="workspace">
      <section class="panel" aria-labelledby="form-title">

        <h2 id="form-title">Registrar ejercicio</h2>

        <form id="exercise-form">
          <label for="name">Nombre del ejercicio</label>
          <input id="name" name="name" type="text" placeholder="Ej. Sentadilla" maxlength="80" required>
          <div class="field-row">
            <div><label for="sets">Series</label><input id="sets" name="sets" type="number" min="1" max="1000" step="1" placeholder="3" required></div>
            <div><label for="reps">Repeticiones</label><input id="reps" name="reps" type="number" min="1" max="10000" step="1" placeholder="12" required></div>
          </div>
          <label for="weight">Peso utilizado (kg)</label>
          <input id="weight" name="weight" type="number" min="0" max="10000" step="0.01" placeholder="0" required aria-describedby="weight-help">
          <small id="weight-help">Usa 0 si trabajas sin peso adicional.</small>
          <button class="primary" type="submit">Registrar ejercicio</button>
        </form>
      </section>

      <section class="records" aria-labelledby="records-title">
        <div class="section-heading"><div><h2 id="records-title">Mis ejercicios</h2></div><span id="record-count" class="count">0 registros</span></div>
        <div id="empty-state" class="empty-state"><h3>Aún no hay ejercicios</h3><p>Añade el primero. Cada repetición cuenta.</p></div>
        <ul id="exercise-list" class="exercise-list"></ul>
      </section>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <footer>Hecho para avanzar a tu ritmo. Tus registros se guardan en este navegador.</footer>
  </main>
</body>
</html>
